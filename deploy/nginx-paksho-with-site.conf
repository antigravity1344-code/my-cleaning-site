# سایت عمومی از فایل‌های ساخته‌شده سرو می‌شود؛ /api و /admin همان برنامهٔ پاکشو می‌مانند.
# مسیر زنده روی سرور: /etc/nginx/sites-available/paksho

server {
    server_name pakshu.ir www.pakshu.ir paksho.ir www.paksho.ir 37.221.113.61;
    client_max_body_size 12m;

    if ($host = www.pakshu.ir) {
        return 301 https://pakshu.ir$request_uri;
    }

    location ^~ /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /admin {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        root /var/www/paksho-site;
        try_files $uri $uri/ /index.html;
    }

    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/pakshu.ir/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/pakshu.ir/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = www.pakshu.ir) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    if ($host = pakshu.ir) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80 default_server;
    listen [::]:80 default_server;
    server_name pakshu.ir www.pakshu.ir paksho.ir www.paksho.ir 37.221.113.61;
    return 404; # managed by Certbot
}
